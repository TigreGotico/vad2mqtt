[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vad2mqtt"
dynamic = ["version"]
description = "Voice Activity Detection to MQTT bridge using ovos-plugin-manager"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "TigreGotico", email = "opensource@tigregotico.com"}
]
keywords = ["vad", "mqtt", "home-assistant", "ovos", "openvoiceos", "silero", "voice-activity-detection", "occupancy-detection", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "ovos-plugin-manager",
    "ovos-vad-plugin-silero>=0.1.3a1",
    "paho-mqtt>=1.6",
    "numpy",
    "sounddevice",
]

[project.scripts]
vad2mqtt = "vad2mqtt.__main__:main"

[project.urls]
Homepage = "https://github.com/TigreGotico/vad2mqtt"
Issues = "https://github.com/TigreGotico/vad2mqtt/issues"

[tool.setuptools.dynamic]
version = {attr = "vad2mqtt.version.__version__"}

[tool.setuptools.packages.find]
include = ["vad2mqtt*"]

[tool.setuptools.package-data]
vad2mqtt = ["*.onnx", "*.json"]
